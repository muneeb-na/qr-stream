<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Stream</title>
    <style>
        /* Clean, human-made CSS variables for consistent colors */
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        /* Mobile-app style main container */
        .app-container {
            width: 100%;
            max-width: 450px;
            margin-top: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .header p { color: var(--text-muted); font-size: 0.9rem; }
        
        /* Modern Tab Navigation */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .tab-btn:hover { background: #2a2a2a; }
        
        /* The active tab gets highlighted */
        .tab-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .hidden { display: none !important; }
        
        .action-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%;
            margin-top: 15px;
            transition: 0.2s;
        }
        .action-btn:hover { background: var(--primary-hover); }
        .action-btn:disabled { background: #3f3f46; color: #a1a1aa; cursor: not-allowed; }
        
        input[type="file"] {
            margin: 15px 0;
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 1px dashed var(--text-muted);
            color: var(--text);
        }
        
        #qr-container { 
            margin: 20px auto 0;
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
        }
        
        #reader { 
            width: 100%; 
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
            border: 2px solid #2a2a2a;
        }
        
        .progress-text {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="header">
            <h1>QR Stream </h1>
            <p>Optical File Transfer</p>
        </div>

        <!-- App Tabs -->
        <div class="tabs">
            <button id="btn-show-send" class="tab-btn active">Send File</button>
            <button id="btn-show-receive" class="tab-btn">Receive File</button>
        </div>

        <!-- SENDER UI -->
        <div id="sender-section" class="card">
            <h3 style="margin-bottom: 5px;">Select a file</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);"></p>
            
            <input type="file" id="file-input" accept="image/*,video/*" />
            <button id="btn-start-send" class="action-btn hidden">Start QR Stream</button>
            
            <!-- Stop and Resume Controls -->
            <div id="sender-controls" class="hidden" style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btn-stop-send" class="action-btn" style="margin-top: 0; background: #ef4444;">Stop Stream</button>
                <button id="btn-resume-send" class="action-btn hidden" style="margin-top: 0; background: #22c55e;">Resume Stream</button>
            </div>
            
            <div id="qr-container" class="hidden"></div>
            <p id="send-progress" class="progress-text"></p>
        </div>

        <!-- RECEIVER UI -->
        <div id="receiver-section" class="card hidden">
            <h3 style="margin-bottom: 5px;">Ready to scan</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Point camera at the sender's screen</p>
            
            <button id="btn-start-receive" class="action-btn">Open Camera</button>
            
            <div id="reader"></div>
            <p id="receive-progress" class="progress-text"></p>
            <div id="result-container"></div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script>
        // Tiny inline script just to handle making the tabs highlight correctly
        const tabSend = document.getElementById('btn-show-send');
        const tabReceive = document.getElementById('btn-show-receive');
        
        tabSend.addEventListener('click', () => {
            tabSend.classList.add('active');
            tabReceive.classList.remove('active');
            
            // Also swap the visible sections
            document.getElementById('sender-section').classList.remove('hidden');
            document.getElementById('receiver-section').classList.add('hidden');
        });

        tabReceive.addEventListener('click', () => {
            tabReceive.classList.add('active');
            tabSend.classList.remove('active');
            
            // Also swap the visible sections
            document.getElementById('receiver-section').classList.remove('hidden');
            document.getElementById('sender-section').classList.add('hidden');
        });
    </script>

    <!-- Your custom logic scripts -->
    <script src="sender.js"></script>
    <script src="receiver.js"></script>
</body>
</html>
